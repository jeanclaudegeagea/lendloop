# Self-hosted n8n for LendLoop's automations.
#   cp n8n/.env.example n8n/.env   # then fill in the values
#   docker compose up -d
#   open http://localhost:5678
#
# Optional public tunnel so Convex Cloud can reach the webhook:
#   docker compose --profile tunnel up -d
#   docker compose logs tunnel   # shows the https://*.trycloudflare.com URL

services:
  n8n:
    # Pinned rather than :latest, so an upstream release can't change behavior unannounced.
    image: docker.n8n.io/n8nio/n8n:2.45.7
    restart: unless-stopped
    ports:
      - "5678:5678"
    # Secrets live here (gitignored), not in this file or in the workflow JSON.
    env_file:
      - ./n8n/.env
    environment:
      GENERIC_TIMEZONE: UTC # loan dates are UTC days; keeps the 08:00 schedule predictable
      TZ: UTC
      # The workflows read CONVEX_SITE_URL and the HMAC secrets through $env.
      # n8n blocks $env by default; see README "Security decisions" for the trade-off.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Local HTTP only. Remove behind HTTPS in production.
      N8N_SECURE_COOKIE: "false"
      # Keep a week of executions for debugging, then prune.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    # Lets n8n reach a Convex backend running on the host (npx convex dev --local).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Only started with --profile tunnel. Gives n8n a temporary public HTTPS URL.
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://n8n:5678
    depends_on:
      - n8n

volumes:
  n8n_data:
